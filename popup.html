<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>链接分享卡片</h1>

  <div class="page">
    <div id="ptitle" class="ptitle">读取中…</div>
    <div id="purl" class="purl"></div>
  </div>

  <div id="fold" class="fold open">
    <button id="foldToggle" type="button" class="foldHead" aria-expanded="true">
      <span>卡片标题与备注</span>
      <span class="foldArrow">▾</span>
    </button>
    <div id="foldBody" class="foldBody">
      <div class="field">
        <span>卡片标题</span>
        <div class="inputBox">
          <input id="title" type="text" placeholder="留空则不显示">
          <input id="titleColor" type="color" value="#1f2329" title="标题颜色">
        </div>
      </div>

      <div class="field">
        <span>备注</span>
        <div class="noteBox">
          <textarea id="note" rows="3" placeholder="留空则中部显示封面大图"></textarea>
          <div class="noteBar">
            <input id="noteBg" type="color" value="#fff8dc" title="备注底色">
            <input id="noteAlpha" type="range" min="0" max="100" step="5" value="100" title="备注底色透明度">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="adapt" class="adapt">
    <button id="adaptToggle" type="button" class="adaptHead" aria-pressed="false">
      <span>文字颜色自适应</span>
      <span id="adaptState" class="adaptState">关</span>
    </button>
    <div id="adaptBody" class="adaptBody" hidden>
      <label class="ctrl">
        <span>文字浓度</span>
        <input id="adaptAlpha" type="range" min="20" max="100" step="10" value="100">
        <span id="adaptAlphaV" class="adaptVal">100%</span>
      </label>
      <label class="ctrl">
        <span>反差强度</span>
        <input id="adaptBeta" type="range" min="0" max="2" step="0.1" value="1">
        <span id="adaptBetaV" class="adaptVal">1.0</span>
      </label>
      <div id="adaptMode" class="seg">
        <button type="button" data-mode="auto" class="on">自动明暗</button>
        <button type="button" data-mode="color">保留色调</button>
      </div>
    </div>
  </div>

  <div class="row">
    <label class="field">
      <span>宽</span>
      <input id="w" type="number" value="400" min="200" max="2000" step="10">
    </label>
    <label class="field">
      <span>高</span>
      <input id="h" type="number" value="560" min="200" max="2000" step="10">
    </label>
  </div>

  <div class="goRow">
    <button id="bgToggle" type="button" class="on" title="封面作背景：开">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
      </svg>
    </button>
    <button id="go" disabled>生成并复制</button>
  </div>
  <div id="msg" class="msg"></div>
  <div id="preview" class="preview"></div>

  <script src="qrcode.js"></script>
  <script src="card.js"></script>
  <script src="popup.js"></script>
</body>
</html>
